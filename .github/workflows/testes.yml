name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    # RNF-06: o Desktop roda em Windows 10/11 e Linux (Ubuntu LTS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o pacote
        run: python -m pip install -e ".[dev]"

      - name: Rodar os testes
        run: python -m pytest -ra
