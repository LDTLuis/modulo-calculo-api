[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "damiq-calc"
dynamic = ["version"]
description = "Motor de cálculo do DAMIQ – segurança de barragens"
readme = "README.md"
requires-python = ">=3.13"
# Matplotlib (M10, gráficos dos relatórios) traz o NumPy; SciPy/Pandas entram quando algum módulo precisar.
dependencies = ["matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]

[project.scripts]
damiq-calc = "damiq_calc.adapters.cli:main"

[tool.setuptools.dynamic]
version = { attr = "damiq_calc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
