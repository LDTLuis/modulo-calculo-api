[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "damiq-calc"
version = "0.1.0"
description = "Motor de cálculo do DAMIQ – segurança de barragens"
readme = "README.md"
requires-python = ">=3.13"
# NumPy, SciPy, Pandas e Matplotlib (stack oficial) entram quando os módulos M2+ precisarem.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
damiq-calc = "damiq_calc.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
